<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Радиус и свет — макет</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#8a51c5,#34205c);color:#fff5df;font:17px system-ui,sans-serif}main{max-width:900px;margin:32px auto;padding:20px}h1{font-size:30px;margin:0}p{line-height:1.5;color:#e3d1f5}.variants{display:flex;gap:20px;flex-wrap:wrap}.card{position:relative;background:#fff1d5;border:3px solid #d9b4ec;border-radius:22px;color:#4a226f;padding:16px;flex:1;min-width:140px;text-align:center}.card img.magnet{width:90px;height:90px;object-fit:contain}.badge{width:64px;height:48px;position:absolute;right:8px;top:70px}.card strong{display:block}.card.selected{box-shadow:0 0 0 4px #f6da79}canvas{width:100%;height:330px;display:block}label{display:block;margin-top:14px}input[type=range]{width:100%}button{font:inherit;padding:10px 24px;border:0;border-radius:16px;background:#ffde8c;color:#4a226f;cursor:pointer}#phase{display:inline-block;margin:0 20px}@media(max-width:500px){main{margin:8px auto;padding:16px}h1{font-size:25px}.variants{gap:12px}.card{padding:12px}.card img.magnet{width:78px}.badge{width:54px;top:64px;right:4px}canvas{height:300px}}</style>
<main><h1>Радиус магнита и свет источников</h1><p>Значок рядом с магнитом показывает одно или два hex-кольца. Свет загорается только на стопках, которые магнит притянет.</p><div class="variants"><div class="card selected"><img class="magnet" src="/art/mockup/magnet-blue.png"><img class="badge" src="/art/range-1.svg"><strong>Одно кольцо</strong></div><div class="card"><img class="magnet" src="/art/mockup/magnet-coral.png"><img class="badge" src="/art/range-2.svg"><strong>Два кольца</strong></div></div><canvas aria-label="Анимация столбов света"></canvas><button id="play">Пауза</button><span id="phase"></span><label>Время цикла <input id="time" type="range" min="0" max="4.5" step=".01" value="0"></label><label><input id="reduced" type="checkbox"> Уменьшение движения</label><p>Предпросмотр → обработка с удержанием света → плавное затухание за 550 мс. Фишки и цифры остаются читаемыми; частиц нет.</p></main><script type="module" src="./preview.js"></script></html>
