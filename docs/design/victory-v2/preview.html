<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Victory v2 preview</title>
<link rel="stylesheet" href="../../../src/prototype/prototype.css">
<style>.preview-game{opacity:.5;position:fixed;inset:0;background:url('before.png') center/contain no-repeat}.preview-options{position:fixed;top:0;left:0;z-index:30;background:#fff;padding:4px;font:12px sans-serif}.modal-backdrop{align-items:center}.unearned{filter:grayscale(1);opacity:.25}</style>
<div class="preview-game"></div><label class="preview-options">Illustrative preview <select id="variant"><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option><option value="12">Final level / long values</option></select></label>
<div class="modal-backdrop victory-dialog"><div class="modal-panel"><div class="result-card"><h2 class="result-title">LEVEL COMPLETE!</h2><div class="earned-stars"><img src="star.png"><img src="star.png"><img src="star.png"></div><div class="victory-stats"><p><span id="moves">8</span><small>MOVES</small></p><p><span id="collected">54 / 50</span><small>COLLECTED</small></p></div><button class="primary-button" id="next">Next level</button><button class="secondary-button light-button">Play again</button></div></div></div>
<script>variant.onchange=()=>{const n=Number(variant.value);document.querySelectorAll('.earned-stars img').forEach((el,i)=>el.className=i<(n===12?1:n)?'earned':'unearned');moves.textContent=n===12?'123456':'8';collected.textContent=n===12?'600 / 600':'54 / 50';next.textContent=n===12?'Play from start':'Next level';};</script></html>
