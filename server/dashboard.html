<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnet Sort · Analytics</title>
<style>body{font:16px system-ui;background:#f5f2ff;color:#24144a;max-width:1000px;margin:32px auto;padding:20px}input,button,select{font:inherit;padding:10px;margin:4px;border:1px solid #8b78ac;border-radius:8px}button{background:#5c35a8;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:12px}label{display:inline-flex;flex-direction:column;gap:4px}p{line-height:1.6}</style>
<h1>Magnet Sort · Analytics</h1>
<p>Opted-in gameplay only. QA is excluded by default. D1/D7 use mature cohorts; an empty cohort is not zero retention. The access key stays in memory and is never stored.</p>
<form id="filters"><label>Admin access key<input type="password" id="key" required autocomplete="off"></label>
<label>From (UTC)<input type="date" id="from"></label><label>Through (UTC)<input type="date" id="to"></label>
<label>Environment<select id="environment"><option>production</option><option>qa</option></select></label>
<label>Platform<select id="platform"><option value="">All</option><option>web</option><option>telegram</option></select></label>
<button>Load aggregate report</button></form><p id="status" role="status"></p><pre id="report">No report loaded.</pre>
<script>
document.querySelector('#filters').addEventListener('submit',async e=>{e.preventDefault();const status=document.querySelector('#status');status.textContent='Loading…';const q=new URLSearchParams();for(const name of ['from','to','environment','platform']){const value=document.getElementById(name).value;if(value)q.set(name,value)}try{const r=await fetch('./admin/analytics?'+q,{headers:{Authorization:'Bearer '+document.getElementById('key').value},credentials:'omit',cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error?.code||'Report unavailable');document.getElementById('report').textContent=JSON.stringify(data,null,2);status.textContent='Aggregate report loaded.'}catch(err){status.textContent=err.message}});
</script></html>
